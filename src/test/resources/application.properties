# Tests laufen gegen eine frische In-Memory-Datenbank, nicht gegen die echte Datei unter ./data.
# So beeinflussen die Startdaten und die Testdaten weder den laufenden Betrieb noch sich gegenseitig.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
