spring.application.name=reisedashboard

# H2 dateibasiert und lokal persistent (Daten ueberleben den Neustart)
spring.datasource.url=jdbc:h2:file:./data/reisedashboard
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# H2-Konsole standardmaessig AUS (offenes Admin-Interface ohne Auth).
# Zum Reinschauen in die DB nur lokal bei Bedarf auf true setzen.
spring.h2.console.enabled=false

server.port=8080

# Session-Id nur im Cookie, nie in der URL (sonst haengt Tomcat beim ersten Redirect ;jsessionid=... an)
server.servlet.session.tracking-modes=cookie
