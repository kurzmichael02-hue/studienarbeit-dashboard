spring.application.name=reisedashboard

# H2 dateibasiert und lokal persistent (Daten ueberleben den Neustart)
spring.datasource.url=jdbc:h2:file:./data/reisedashboard;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2-Konsole zum Reinschauen in die DB (nur Entwicklung): http://localhost:8080/h2-console
spring.h2.console.enabled=true

server.port=8080
